<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="920" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#ff5ca8"/>
    </linearGradient>
    <radialGradient id="shine" cx="300" cy="200" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1b0f4d" flood-opacity="0.35"/>
    </filter>
    <!-- link shapes, in a frame turned 45 degrees -->
    <rect id="A" x="318" y="190" width="250" height="430" rx="125"/>
    <rect id="B" x="456" y="404" width="250" height="430" rx="125"/>
    <!-- B passes over A near the top crossing, A over B near the bottom one -->
    <mask id="mA" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <g clip-path="url(#topCross)"><use href="#B" fill="none" stroke="#000" stroke-width="128"/></g>
    </mask>
    <mask id="mB" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <g clip-path="url(#botCross)"><use href="#A" fill="none" stroke="#000" stroke-width="128"/></g>
    </mask>
    <clipPath id="topCross"><rect x="250" y="330" width="300" height="200"/></clipPath>
    <clipPath id="botCross"><rect x="500" y="500" width="300" height="200"/></clipPath>
  </defs>
  <path d="M512 40c330 0 472 142 472 472s-142 472-472 472S40 842 40 512 182 40 512 40z" fill="url(#bg)"/>
  <path d="M512 40c330 0 472 142 472 472s-142 472-472 472S40 842 40 512 182 40 512 40z" fill="url(#shine)"/>
  <g filter="url(#shadow)">
    <g transform="rotate(45 512 512)" fill="none" stroke="#fff" stroke-width="70">
      <use href="#A" mask="url(#mA)"/>
      <use href="#B" mask="url(#mB)" stroke-opacity="0.94"/>
    </g>
  </g>
</svg>
