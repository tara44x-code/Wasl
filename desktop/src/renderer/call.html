<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <style>
    html, body { margin: 0; height: 100%; background: transparent; font-family: "Segoe UI", system-ui, sans-serif; user-select: none; overflow: hidden; }
    .card { position: absolute; inset: 6px; border-radius: 18px; padding: 16px 18px; box-sizing: border-box;
      background: #10142a; color: #eef0ff; border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 12px 34px rgba(0,0,0,0.45); display: flex; flex-direction: column; gap: 10px; -webkit-app-region: drag; }
    .top { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(135deg, #22d3ee, #7c5cff 60%, #ff5ca8);
      display: grid; place-items: center; font-weight: 700; font-size: 18px; flex: none; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 9px rgba(124,92,255,0.18); } }
    .who { min-width: 0; }
    .label { font-size: 12px; color: #9aa0c3; }
    .name { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .num { font-size: 12.5px; color: #9aa0c3; direction: ltr; text-align: start; }
    .row { display: flex; gap: 10px; -webkit-app-region: no-drag; }
    button { flex: 1; border: 0; border-radius: 12px; padding: 9px; font: inherit; font-weight: 700; color: #fff; cursor: pointer; }
    .answer { background: #10b981; }
    .decline { background: #ef4444; }
    .x { position: absolute; top: 8px; inset-inline-end: 10px; background: none; border: 0; color: #9aa0c3; font-size: 18px; flex: none; padding: 2px 6px; -webkit-app-region: no-drag; }
  </style>
</head>
<body>
  <div class="card">
    <button class="x" id="x">×</button>
    <div class="top">
      <div class="avatar" id="avatar">☎</div>
      <div class="who">
        <div class="label" id="label"></div>
        <div class="name" id="name" dir="auto"></div>
        <div class="num" id="num"></div>
      </div>
    </div>
    <div class="row">
      <button class="answer" id="answer"></button>
      <button class="decline" id="decline"></button>
    </div>
  </div>
  <script src="call.js"></script>
</body>
</html>
