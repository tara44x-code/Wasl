<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Wasl</title>
  <style>
    html, body { margin: 0; height: 100%; background: #05060c; color: #eef0ff; font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; user-select: none; }
    body { display: flex; flex-direction: column; }
    #stage { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; position: relative; }
    canvas { max-width: 100%; max-height: 100%; display: block; cursor: default; outline: none; border-radius: 6px; }
    #wait { position: absolute; inset: 0; display: grid; place-items: center; color: #9aa0c3; font-size: 14px; }
    .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #2a2f55; border-top-color: #7c5cff; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #bar { height: 52px; flex: none; display: flex; align-items: center; justify-content: center; gap: 4px; background: #0b0e1a; border-top: 1px solid rgba(255,255,255,0.07); }
    #bar button { width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; color: #c9cdf0; cursor: pointer; display: grid; place-items: center; }
    #bar button:hover { background: rgba(255,255,255,0.08); color: #fff; }
    #bar button.on { background: linear-gradient(135deg, #22d3ee, #7c5cff); color: #fff; }
    #bar svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    #bar .sep { width: 1px; height: 22px; background: rgba(255,255,255,0.1); margin: 0 4px; }
    #toast { position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%); background: #eef0ff; color: #0b0e1a; padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="screen" tabindex="0"></canvas>
    <div id="wait"><div><div class="spinner"></div><span id="waitText"></span></div></div>
  </div>
  <div id="bar">
    <button data-act="back" data-tip="back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button data-act="home" data-tip="home"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></svg></button>
    <button data-act="recents" data-tip="recents"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
    <span class="sep"></span>
    <button data-act="voldown" data-tip="voldown"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15 12h5"/></svg></button>
    <button data-act="volup" data-tip="volup"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15 12h5M17.5 9.5v5"/></svg></button>
    <button data-act="mute" data-tip="mute" id="muteBtn"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg></button>
    <span class="sep"></span>
    <button data-act="notifications" data-tip="notifications"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/></svg></button>
    <button data-act="rotate" data-tip="rotate"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
    <button data-act="screenshot" data-tip="screenshot"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
    <button data-act="screenoff" data-tip="screenoff" id="screenBtn"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M4 4l16 16"/></svg></button>
    <button data-act="power" data-tip="power"><svg viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.4 6.4a8 8 0 1 0 11.2 0"/></svg></button>
  </div>
  <div id="toast" hidden></div>
  <script src="mirror-view.js"></script>
</body>
</html>
